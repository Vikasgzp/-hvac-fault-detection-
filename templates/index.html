<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HVAC Fault Detection</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background: #0f172a;
        color: white;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        width: 100%;
        max-width: 1000px;
        background: #1e293b;
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 0 25px rgba(0, 0, 0, 0.4);
      }

      h1 {
        text-align: center;
        margin-bottom: 10px;
        font-size: 40px;
      }

      p {
        text-align: center;
        color: #cbd5e1;
        margin-bottom: 30px;
      }

      .upload-box {
        border: 2px dashed #64748b;
        border-radius: 15px;
        padding: 40px;
        text-align: center;
        margin-bottom: 20px;
      }

      input[type="file"] {
        margin-top: 15px;
        color: white;
      }

      button {
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 12px;
        background: #3b82f6;
        color: white;
        font-size: 18px;
        cursor: pointer;
        transition: 0.3s;
      }

      button:hover {
        background: #2563eb;
      }

      .loading {
        margin-top: 20px;
        text-align: center;
        display: none;
      }

      table {
        width: 100%;
        margin-top: 30px;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 15px;
        border-bottom: 1px solid #334155;
        text-align: center;
      }

      th {
        background: #334155;
      }

      tr:hover {
        background: #273449;
      }

      .error {
        color: #ef4444;
        margin-top: 20px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>HVAC Fault Detection</h1>

      <p>Upload HVAC sensor CSV file for AI-based fault prediction</p>

      <div class="upload-box">
        <h2>Upload CSV File</h2>

        <input type="file" id="fileInput" accept=".csv" />
      </div>

      <button onclick="uploadFile()">Predict Faults</button>

      <div class="loading" id="loading">Processing predictions...</div>

      <div class="error" id="error"></div>

      <table id="resultTable" style="display: none">
        <thead>
          <tr>
            <th>Row</th>
            <th>Predicted Fault</th>
            <th>Confidence</th>
          </tr>
        </thead>

        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <script>
      async function uploadFile() {
        const fileInput = document.getElementById("fileInput");

        const file = fileInput.files[0];

        const loading = document.getElementById("loading");

        const error = document.getElementById("error");

        const resultTable = document.getElementById("resultTable");

        const tableBody = document.getElementById("tableBody");

        error.innerHTML = "";
        tableBody.innerHTML = "";

        if (!file) {
          error.innerHTML = "Please upload a CSV file";
          return;
        }

        const formData = new FormData();

        formData.append("file", file);

        loading.style.display = "block";

        resultTable.style.display = "none";

        try {
          const response = await fetch("/predict", {
            method: "POST",
            body: formData,
          });

          const data = await response.json();

          loading.style.display = "none";

          if (data.error) {
            error.innerHTML = data.error;
            return;
          }

          data.results.forEach((item) => {
            const row = `
                        <tr>
                            <td>${item.row}</td>
                            <td>${item.prediction}</td>
                            <td>${item.confidence}%</td>
                        </tr>
                    `;

            tableBody.innerHTML += row;
          });

          resultTable.style.display = "table";
        } catch (err) {
          loading.style.display = "none";

          error.innerHTML = "Something went wrong";
        }
      }
    </script>
  </body>
</html>
